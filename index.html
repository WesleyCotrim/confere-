<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar – Conferências</title>
<link rel="stylesheet" href="css/style.css"></head><body>
<main class="login"><h1>Conferências</h1>
<form class="card" id="f">
<label for="e">E-mail</label><input id="e" type="email" required autocomplete="username">
<label for="s">Senha</label><input id="s" type="password" required autocomplete="current-password">
<p><button class="btn" style="width:100%">Entrar</button></p></form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/app.js"></script>
<script>
sb.auth.getSession().then(({data:{session}})=>{ if(session) location.href='historico.html'; });
$('#f').onsubmit = async e => {
  e.preventDefault();
  const { error } = await sb.auth.signInWithPassword({ email: $('#e').value, password: $('#s').value });
  if (error) return toast('Erro: ' + error.message, true);;
  location.href = 'historico.html';
};
</script></body></html>
