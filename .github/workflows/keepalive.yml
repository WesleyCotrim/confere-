# Evita que o Supabase grátis pause o projeto por inatividade
name: keepalive
on:
  schedule:
    - cron: '0 12 * * 1,4'   # segunda e quinta
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Acessa a API do Supabase
        run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/produtores?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
